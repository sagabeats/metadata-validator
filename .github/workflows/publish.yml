# Builds and pushes ghcr.io/sagabeats/metadata-validator:prod.
# Watchtower on the VPS polls every 30s and rolling-restarts the container
# once a new :prod digest appears -- same flow as crm-api and crm-web.

name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/metadata-validator

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # :prod is what watchtower tracks; the SHA tag lets you roll back.
          tags: |
            ${{ env.IMAGE }}:prod
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the pushed image
        run: |
          docker run -d --name smoke -p 8000:8000 -e API_KEY=ci-test ${{ env.IMAGE }}:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -sf localhost:8000/health >/dev/null && break || sleep 2
          done
          curl -sf localhost:8000/health | grep -q '"ok":true'
          # Auth must reject an unauthenticated call.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/check)" = "401"
          docker rm -f smoke
